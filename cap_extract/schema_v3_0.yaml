version: "3.0"
prompt_version: "v3_0"
principle: >-
  The objective is not to maximise the number of extracted records. The objective is to create economically comparable structured observations across municipalities despite differences in document length, writing style, headings, and bullet formatting. Do not infer information merely to fill fields. Preserve raw evidence and leave fields Not Disclosed, N/A, or Unclear where appropriate. One independent action/project/programme/policy should normally correspond to one Action row, with all directly related environmental-risk and fiscal information mapped to that action.
schemas:
  Plan Level: [plan_id, jurisdiction, state, gov_type, plan_year, plan_orientation_controlled, plan_orientation_verbatim, document_type_controlled, document_type_verbatim, plan_scope_controlled, plan_scope_verbatim, plan_formal_status, formal_status_verbatim, adoption_date, adopting_body, plan_implementation_status, implementation_status_verbatim, risk_register_coverage, new_or_update, new_or_update_verbatim, prior_plan_year, prior_plan_reference, primary_author, governance_body, monitoring_arrangement, policy_integration, unaddressed_local_risks, unaddressed_risk_evidence, discovery_tag, discovery_description, source_file, evidence_text, source_page, confidence]
  Action Level: [action_id, plan_id, action_title, action_description, climate_relevance, action_orientation, environmental_issue_addressed, issue_type, hazards, hazard_verbatim, mitigation_issue, affected_sector, affected_asset_or_infrastructure, affected_population, local_exposure_description, economic_consequence, municipal_revenue_consequence, municipal_expenditure_consequence, municipal_asset_consequence, service_delivery_consequence, future_capital_need, risk_quantified, risk_value_raw, risk_value_numeric, risk_unit, risk_currency, risk_scenario, risk_time_horizon, responsible_owner, supporting_partner, governance_body, target_description, target_value, target_unit, baseline_value, baseline_year, target_year, quantified_output, implementation_status_raw, implementation_status_controlled, timeline, milestone, KPI, monitoring_metric, cost_raw, cost_numeric_min, cost_numeric_max, cost_currency, cost_qualitative, cost_basis, funding_source, funding_status, municipal_budget_link, CIP_link, debt_or_bond_financing, recurring_cost, financial_appraisal_type, financial_appraisal_value, financial_appraisal_horizon, risk_evidence_text, action_evidence_text, source_page, source_section, confidence, discovery_tag, discovery_description]
fields:
  plan_orientation_controlled: {definition: Substantive plan orientation, allowed: [Mitigation, Adaptation, Combined, Unclear]}
  document_type_controlled: {definition: Controlled document type separate from orientation, allowed: [Climate Action Plan, Energy Plan, Sustainability Plan, Resilience Plan, Vulnerability Assessment, Other]}
  plan_scope_controlled: {definition: Explicit jurisdictional scope, allowed: [Government Operations, Community-wide, Both, Unclear]}
  plan_formal_status: {definition: Formal status; Final is not Adopted, allowed: [Draft, Interim, Final, Adopted, Unclear]}
  plan_implementation_status: {definition: Explicit plan-level status, allowed: [Not Started, Implementing, Operational, Completed, Ongoing, Unclear]}
  risk_register_coverage: {definition: Whether all selected risk pages were successfully processed, allowed: [Complete, Partial]}
  new_or_update: {definition: Controlled new/update/revision, allowed: [New, Update, Revision, Unclear]}
  climate_relevance: {definition: Action climate linkage, allowed: [Direct, Enabling, Contextual, Unclear]}
  action_orientation: {definition: Substantive mitigation/adaptation orientation, allowed: [Mitigation, Adaptation, Both, Unclear]}
  issue_type: {definition: Environmental issue addressed, allowed: [Physical Risk, Transition / Mitigation Issue, Both, Unclear]}
  hazards: {definition: Controlled local hazard labels joined by ' | ', allowed: dictionaries.yaml hazards}
  mitigation_issue: {definition: Mitigation labels joined by ' | ', allowed: [GHG emissions, Building energy use, Transport emissions, Fossil-fuel dependence, Electricity emissions, Waste emissions, Other]}
  risk_quantified: {definition: Whether local risk is quantified, allowed: [Yes, No, Unclear]}
  implementation_status_controlled: {definition: Controlled action delivery status, allowed: [Not Started, Implementing, Operational, Completed, Ongoing, Unclear]}
  cost_qualitative: {definition: Qualitative cost only, allowed: [Low, Medium, High, Other, Not stated]}
  cost_basis: {definition: Explicit cost basis, allowed: [Total Project, Annual, CAPEX, OPEX, Per Unit, Staff Time, Maintenance, Other, Unclear]}
  funding_status: {definition: Explicit funding commitment, allowed: [Secured, Partial, Seeking, Not Secured, Unclear]}
eval_mappings:
  plan_orientation_controlled: {Mitigation / Sustainability: Mitigation}
  document_type_controlled: {Climate Action Plan: Climate Action Plan, Sustainability Plan: Sustainability Plan, Energy Strategy: Energy Plan, Energy Plan: Energy Plan, Sea-Level Rise / Adaptation Plan: Resilience Plan, Heat Resilience Playbook: Resilience Plan, Climate Adaptation / Resilience Report: Vulnerability Assessment}
  plan_scope_controlled: {Community + municipal assets: Both, Community + infrastructure: Both}
  plan_formal_status: {Final: Final}
prompts:
  plan: >-
    Extract exactly one Plan Level row using the opening pages plus selected governance, monitoring, and adoption pages. plan_orientation_controlled is Mitigation only for substantive GHG reduction, energy transition, renewables, efficiency, transport decarbonisation, or waste-emission content; Adaptation for substantive local physical/environmental risk or resilience; Combined only when both are substantive; otherwise Unclear. Never classify from the title alone. document_type_controlled is separate from orientation and must use only the listed controlled categories; preserve the printed name in document_type_verbatim. plan_scope_controlled is Government Operations, Community-wide, Both, or Unclear. plan_formal_status is Draft for draft/public consultation; Interim only for explicitly temporary/transitional plans; Final for a final document without explicit government adoption; Adopted only with explicit approval/adoption/passage by an authorised public body; otherwise Unclear. Final is not Adopted. Give adoption_date in ISO format at the precision disclosed. Preserve formal_status_verbatim. plan_implementation_status requires explicit plan-level evidence and cannot be inferred from completed actions. new_or_update is only New, Update, Revision, or Unclear; put prior year/reference in the corresponding fields and source wording in new_or_update_verbatim. Extract author, governance, monitoring/reporting, and policy integration from any supplied relevant page. Include field_evidence keyed by every substantive Plan Level value, with exact quote, source page, and section.
  risk: >-
    Extract an internal municipality-specific risk register, not a Risk Level output sheet. One record per distinct local hazard x consequence chain; merge repeated mentions of the same hazard/exposure/consequence. Include a risk_key, controlled hazards, verbatim hazard, affected sector/assets/population, local exposure, disclosed fiscal/economic consequences, quantification, evidence text, page and section. Local relevance must be tied to the jurisdiction, local population/economy, public assets/infrastructure/services, or municipal finances. Exclude generic climate science and regional/national/global background. Fiscal consequence is not required. Resident costs are not municipal expenditures unless the plan says so. Do not infer that a risk is unaddressed; action linkage is decided after the Action pass. Provide field_evidence for each substantive register field.
  action: >-
    Extract one row per independent action/project/programme/policy. Merge bullets and implementation steps into one description (maximum 500 characters); split only when a sub-item has independent owner, target, timeline, status, cost, funding, or can stand alone. Do not create background-only rows. climate_relevance is Direct for an evidenced mitigation/adaptation outcome; Enabling for explicit support to plan delivery without direct outcome; Contextual for an ordinary municipal activity without a substantive climate/environmental linkage; Unclear if evidence is insufficient. Plan inclusion alone does not imply Direct. action_orientation is Mitigation, Adaptation, Both, or Unclear; do not default general sustainability, economic development, transportation, land use, planning, or investment to Mitigation. Use issue_type and mitigation_issue without forcing a physical hazard onto mitigation actions. Use the supplied compact risk register and cite linked_risk_keys only when the PDF explicitly links the action or the purpose makes the link substantively unambiguous. Copy linked risk fields only in post-processing; never create a standalone risk record from an action. Local exposure must concern this jurisdiction, residents, local economy, public assets/infrastructure/services, or municipal finances. A local risk can be retained without fiscal consequence. Populate municipal revenue/expenditure/asset/service/capital fields only when the PDF links the impact to the municipality. `cost_raw` preserves source wording; numeric cost fields contain numeric values only, with a single estimate copied to min and max. Put High/Medium/Low in cost_qualitative only. Funding source is not proof of secured funding. target_value is only an overall target magnitude; counts of installations belong in quantified_output. Keep raw/controlled implementation status, timeline, milestone, KPI, monitoring, owner, partner, governance, funding, budget/CIP/bond, recurring cost, and financial appraisal distinct. Evidence must support every substantive field, especially risk links, fiscal effects, target, cost, funding, status, adoption, and owner.
overarching_rules: >-
  Raw structured extraction only. No scores, ranks, indices, dimension averages, or 0/0.5/1 values. Omit optional fields with no value; post-processing records Not Disclosed where appropriate and retains N/A or Unclear only when supported. Never output literal None, null, or nan. Cite supplied page markers. Evidence must be source-grounded.
schema_changes:
  - {field: Risk Level, change: Removed as core export; internal risk register is joined to Action Level, reason: Resolve risk/action links across separate page sets without standalone risk rows.}
  - {field: Evidence and missingness, change: Field-specific Evidence Log and post-processed missingness, reason: Reduce model output while preserving evidence traceability.}
  - {field: Missingness rule, change: Omitted optional fields become Not Disclosed; explicit N/A and Unclear remain unchanged, reason: Control output cost without confusing absence with non-applicability or ambiguity.}
  - {field: Discovery evidence, change: Discovery field evidence is stored in Evidence Log, reason: Preserve provenance without adding discovery evidence columns to core tables.}
  - {field: Rule Features, change: Flattened to one column per feature, reason: Make deterministic features directly analyzable.}
  - {field: Variable Dictionary, change: Exact v3.0 fields only, reason: Remove legacy fields.}
